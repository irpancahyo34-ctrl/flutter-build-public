- name: Detect Flutter version
  id: detect
  run: |
    set -e

    ROOT=$(find source -maxdepth 4 -name pubspec.yaml -exec dirname {} \; | head -1)
    if [ -z "$ROOT" ]; then
      echo "❌ pubspec.yaml gak ketemu"
      exit 1
    fi
    echo "root=$ROOT" >> $GITHUB_OUTPUT

    # ── Prioritas 1: .fvmrc ──
    if [ -f "$ROOT/.fvmrc" ]; then
      FVM_VER=$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' "$ROOT/.fvmrc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
      if [ -n "$FVM_VER" ]; then
        echo "flutter=$FVM_VER" >> $GITHUB_OUTPUT
        exit 0
      fi
    fi

    # ── Prioritas 2: flutter_version di pubspec ──
    FV=$(grep -E '^\s*flutter_version\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*:\s*"?([0-9.]+)"?.*/\1/' || true)
    if [ -n "$FV" ] && [ "$FV" != "null" ]; then
      echo "flutter=$FV" >> $GITHUB_OUTPUT
      exit 0
    fi

    # ── Prioritas 3: baca Dart dari pubspec.lock ──
    DART_VER=""
    if [ -f "$ROOT/pubspec.lock" ]; then
      DART_VER=$(grep -A5 '^sdks:' "$ROOT/pubspec.lock" | grep -E '^\s*dart\s*:' | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)
    fi

    # ── Prioritas 4: baca Dart dari pubspec.yaml ──
    if [ -z "$DART_VER" ]; then
      DART_CONSTRAINT=$(grep -E '^\s*sdk\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*sdk\s*:\s*//; s/["'"'"']//g' || true)
      DART_VER=$(echo "$DART_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+' | tail -1 || true)
    fi

    echo "📋 Dart SDK: $DART_VER"

    # ── MAPPING LENGKAP DART -> FLUTTER (SEMUA VERSI) ──
    MAPPING="
      1.0  1.0.0
      1.1  1.0.0
      1.2  1.0.0
      1.3  1.0.0
      1.4  1.0.0
      1.5  1.0.0
      1.6  1.0.0
      1.7  1.0.0
      1.8  1.0.0
      1.9  1.0.0
      1.10 1.0.0
      1.11 1.0.0
      1.12 1.0.0
      1.13 1.0.0
      1.14 1.0.0
      1.15 1.0.0
      1.16 1.0.0
      1.17 1.0.0
      1.18 1.0.0
      1.19 1.0.0
      1.20 1.0.0
      1.21 1.0.0
      1.22 1.0.0
      1.23 1.0.0
      1.24 1.0.0
      2.0  1.0.0
      2.1  1.2.0
      2.2  1.5.0
      2.3  1.7.0
      2.4  1.9.0
      2.5  1.12.13
      2.6  1.14.0
      2.7  1.17.0
      2.8  1.20.0
      2.9  1.22.0
      2.10 2.0.0
      2.11 2.0.0
      2.12 2.2.0
      2.13 2.5.0
      2.14 2.8.0
      2.15 2.10.0
      2.16 3.0.0
      2.17 3.0.0
      2.18 3.3.0
      2.19 3.7.0
      3.0  3.10.0
      3.1  3.13.0
      3.2  3.16.0
      3.3  3.19.0
      3.4  3.22.0
      3.5  3.24.0
      3.6  3.27.0
      3.7  3.29.0
      3.8  3.32.0
      3.9  3.35.0
    "

    FLUTTER=""
    for line in $MAPPING; do
      DM=$(echo "$line" | awk '{print $1}')
      FV=$(echo "$line" | awk '{print $2}')
      if [ "$DM" = "$DART_VER" ]; then
        FLUTTER="$FV"
        break
      fi
    done

    if [ -z "$FLUTTER" ]; then
      echo "⚠️ Dart '$DART_VER' tidak ada → fallback stable"
      FLUTTER="stable"
    fi

    echo "🎯 Dart $DART_VER → Flutter $FLUTTER"
    echo "flutter=$FLUTTER" >> $GITHUB_OUTPUT
    echo "dart=$DART_VER" >> $GITHUB_OUTPUT
