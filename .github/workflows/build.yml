
name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP source'
        required: true
      tag:
        description: 'Tag release'
        required: true
      build_type:
        description: 'release atau debug'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: 📥 Download ZIP
        id: download
        shell: bash
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          echo "🔗 URL: $URL"
          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "📥 Attempt $i/$MAX_RETRY"
            HTTP_CODE=$(curl -L -s -w "%{http_code}" -o source.zip "$URL" || echo "000")
            echo "📥 HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Download sukses"
              break
            else
              if [ "$i" -eq "$MAX_RETRY" ]; then
                echo "❌ Download gagal"; exit 1
              fi
              sleep 3
            fi
          done
          ls -lh source.zip
          SIZE=$(stat -c%s source.zip)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "📦 Size: $SIZE bytes"

      - name: 🔍 Validate ZIP
        shell: bash
        run: |
          set -e
          SIZE="${{ steps.download.outputs.size }}"
          if [ "$SIZE" -lt 10000 ]; then echo "❌ File kecil"; exit 1; fi
          MAGIC=$(head -c 4 source.zip | xxd -p)
          if [ "$MAGIC" != "504b0304" ]; then echo "❌ Bukan ZIP"; exit 1; fi
          echo "✅ ZIP valid"

      - name: 📦 Extract ZIP
        shell: bash
        run: |
          set -e
          mkdir -p source
          unzip -q source.zip -d source
          ls -la source/

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔍 Detect Flutter version
        id: detect
        shell: bash
        run: |
          set -e
          ROOT=$(find source -maxdepth 4 -name pubspec.yaml -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then echo "❌ pubspec.yaml gak ketemu"; exit 1; fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✅ Project root: $ROOT"

          if [ -f "$ROOT/.fvmrc" ]; then
            FVM_VER=$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' "$ROOT/.fvmrc" \
                      | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "$FVM_VER" ]; then
              echo "🎯 [.fvmrc] Flutter: $FVM_VER"
              echo "flutter=$FVM_VER" >> $GITHUB_OUTPUT
              echo "source=manual" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          FV=$(grep -E '^\s*flutter_version\s*:' "$ROOT/pubspec.yaml" \
               | head -1 | sed -E 's/.*:\s*"?([0-9.]+)"?.*/\1/' || true)
          if [ -n "$FV" ] && [ "$FV" != "null" ]; then
            echo "🎯 [pubspec flutter_version] Flutter: $FV"
            echo "flutter=$FV" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          DART_CONSTRAINT=$(grep -E '^\s*sdk\s*:' "$ROOT/pubspec.yaml" \
                            | head -1 | sed -E 's/.*sdk\s*:\s*//; s/["'"'"']//g' || true)
          echo "📋 [pubspec.yaml] Dart constraint: $DART_CONSTRAINT"
          DART_MINOR=$(echo "$DART_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+' | tail -1 || true)
          echo "📋 Dart minor: $DART_MINOR"

          if [ -z "$DART_MINOR" ] && [ -f "$ROOT/pubspec.lock" ]; then
            DART_MINOR=$(grep -A5 '^sdks:' "$ROOT/pubspec.lock" \
                         | grep -E '^\s*dart\s*:' \
                         | grep -oE '[0-9]+\.[0-9]+' | tail -1 || true)
            echo "📋 [pubspec.lock] Dart: $DART_MINOR"
          fi

          MAPPING="
            2.0  1.0.0
            2.1  1.12.13
            2.2  1.17.0
            2.3  1.20.0
            2.4  1.22.0
            2.5  2.0.0
            2.6  2.0.0
            2.7  2.2.0
            2.8  2.5.0
            2.9  2.8.0
            2.10 2.10.0
            2.11 2.10.0
            2.12 2.0.0
            2.13 2.2.0
            2.14 2.5.0
            2.15 2.8.0
            2.16 2.10.0
            2.17 3.0.0
            2.18 3.3.0
            2.19 3.7.0
            3.0  3.10.0
            3.1  3.13.0
            3.2  3.16.0
            3.3  3.19.0
            3.4  3.22.0
            3.5  3.24.0
            3.6  3.27.0
            3.7  3.29.0
            3.8  3.32.0
            3.9  3.35.0
            3.10 3.35.0
            3.11 3.35.0
            3.12 3.35.0
            3.13 3.35.0
          "

          FLUTTER=""
          for line in $MAPPING; do
            DM=$(echo "$line" | awk '{print $1}')
            FV=$(echo "$line" | awk '{print $2}')
            if [ "$DM" = "$DART_MINOR" ]; then FLUTTER="$FV"; break; fi
          done

          if [ -z "$FLUTTER" ]; then
            echo "⚠️ Dart minor '$DART_MINOR' tidak ada, fetch dari API"
            FLUTTER=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
              | jq -r '.releases[] | select(.channel=="stable") | .version' | head -1)
            if [ -z "$FLUTTER" ] || [ "$FLUTTER" = "null" ]; then FLUTTER="3.35.0"; fi
            echo "🎯 Fallback: $FLUTTER"
          fi

          echo "🎯 Flutter dipilih: $FLUTTER"
          echo "flutter=$FLUTTER" >> $GITHUB_OUTPUT
          echo "source=auto" >> $GITHUB_OUTPUT

      - name: ✔️ Validate Flutter Version
        id: validate
        shell: bash
        run: |
          set -e
          VER="${{ steps.detect.outputs.flutter }}"
          echo "🔍 Cek versi: $VER"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${VER}-stable.tar.xz")
          if [ "$HTTP" != "200" ]; then
            echo "❌ Flutter $VER tidak valid (HTTP $HTTP)"
            FALLBACK=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
              | jq -r '.releases[] | select(.channel=="stable") | .version' | head -1)
            [ -z "$FALLBACK" ] && FALLBACK="3.35.0"
            echo "flutter=$FALLBACK" >> $GITHUB_OUTPUT
          else
            echo "✅ Flutter $VER valid"
            echo "flutter=$VER" >> $GITHUB_OUTPUT
          fi

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.validate.outputs.flutter }}
          channel: 'stable'
          cache: true

      - name: 🛠️ Auto-fix Android toolchain
        id: android_fix
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e
          FLUTTER_VER="${{ steps.validate.outputs.flutter }}"
          echo "🎯 Flutter version: $FLUTTER_VER"

          GUDANG="
            1.0  4.10.2  3.0.0   1.2.71
            1.12 4.10.2  3.5.0   1.3.50
            1.17 5.6.4   3.6.4   1.3.72
            1.20 6.1.1   4.0.1   1.3.72
            1.22 6.7     4.1.0   1.4.32
            2.0  6.7     4.1.0   1.4.32
            2.2  6.7     4.1.0   1.5.31
            2.5  6.7     4.1.0   1.5.31
            2.8  6.7     4.2.0   1.6.10
            2.10 6.7     4.2.0   1.6.10
            3.0  7.5     7.4.2   1.7.10
            3.3  7.5     7.4.2   1.7.10
            3.7  7.5     7.4.2   1.7.10
            3.10 8.0     8.0.2   1.8.0
            3.13 8.1.0   8.1.0   1.8.0
            3.16 8.3     8.1.1   1.8.22
            3.19 8.3     8.2.1   1.8.22
            3.22 8.4     8.3.0   1.9.22
            3.24 8.6     8.3.0   1.9.24
            3.27 8.9     8.6.0   2.0.20
            3.29 8.10    8.7.0   2.0.21
            3.32 8.12    8.7.0   2.1.0
            3.35 8.14    8.7.0   2.1.0
            3.47 8.14    8.9.1   2.1.10
          "

          FLUTTER_MM=$(echo "$FLUTTER_VER" | grep -oE '^[0-9]+\.[0-9]+' || echo "3.32")
          echo "📋 Flutter MM: $FLUTTER_MM"

          GRADLE="8.12"; AGP="8.7.0"; KOTLIN="2.1.0"
          for line in $GUDANG; do
            FMM=$(echo "$line" | awk '{print $1}')
            GR=$(echo "$line" | awk '{print $2}')
            AG=$(echo "$line" | awk '{print $3}')
            KT=$(echo "$line" | awk '{print $4}')
            if [ "$(printf '%s\n%s' "$FMM" "$FLUTTER_MM" | sort -V | tail -1)" = "$FLUTTER_MM" ]; then
              GRADLE="$GR"; AGP="$AG"; KOTLIN="$KT"
            fi
          done

          echo "✅ Toolchain: Gradle=$GRADLE, AGP=$AGP, Kotlin=$KOTLIN"
          echo "gradle=$GRADLE" >> $GITHUB_OUTPUT

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i "s|gradle-[0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?-\(all\|bin\).zip|gradle-${GRADLE}-bin.zip|g" "$WRAPPER"
            echo "✅ Wrapper updated"
          fi

          for SETTINGS in android/settings.gradle.kts android/settings.gradle; do
            if [ -f "$SETTINGS" ]; then
              sed -i -E "s|(id\(\"com\.android\.application\"\)\s+version\s+\")[^\"]+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'com\.android\.application'\s+version\s+')[^']+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\(\"org\.jetbrains\.kotlin\.android\"\)\s+version\s+\")[^\"]+|\1${KOTLIN}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'org\.jetbrains\.kotlin\.android'\s+version\s+')[^']+|\1${KOTLIN}|g" "$SETTINGS"
              echo "✅ Patched: $SETTINGS"
            fi
          done

          for BUILD in android/build.gradle.kts android/build.gradle; do
            if [ -f "$BUILD" ]; then
              sed -i -E "s|(com\.android\.tools\.build:gradle:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${AGP}|g" "$BUILD"
              sed -i -E "s|(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${KOTLIN}|g" "$BUILD"
              echo "✅ Patched: $BUILD"
            fi
          done

          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -q "android.useAndroidX" "$GRADLE_PROPS" || echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
            grep -q "android.enableJetifier" "$GRADLE_PROPS" || echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
            grep -q "org.gradle.jvmargs" "$GRADLE_PROPS" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> "$GRADLE_PROPS"
            echo "✅ gradle.properties patched"
          fi

      - name: 📚 Flutter pub get
        id: pubget
        continue-on-error: true
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee ${{ github.workspace }}/build.log
          flutter pub get 2>&1 | tee -a ${{ github.workspace }}/build.log

      - name: 🔄 Retry pub get (fallback)
        if: steps.pubget.outcome == 'failure'
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          echo "⚠️ pub get gagal, coba Flutter stable terbaru"
          cd $FLUTTER_ROOT
          git checkout stable || true
          git pull || true
          cd -
          flutter pub get 2>&1 | tee -a ${{ github.workspace }}/build.log

      - name: 🏗️ Flutter build APK
        id: build_apk
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --${{ github.event.inputs.build_type }} \
            --android-skip-build-dependency-validation 2>&1 | tee -a ${{ github.workspace }}/build.log

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: |
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: 🤖 AI Error Analyzer
        if: failure()
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAG: ${{ github.event.inputs.tag }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          echo "🤖 AI Error Analyzer dimulai..."
          
          LOG_FILE="${{ github.workspace }}/build.log"
          if [ ! -f "$LOG_FILE" ]; then
            echo "⚠️ build.log tidak ada, skip AI"; exit 0
          fi

          RAW_LOG=$(cat "$LOG_FILE")
          FILTERED=$(echo "$RAW_LOG" \
            | grep -n -iE "error|fail|exception|cannot|unable|missing|not found|invalid|conflict|required" \
            | head -60 || true)
          if [ $(echo "$FILTERED" | wc -l) -lt 5 ]; then
            FILTERED=$(echo "$RAW_LOG" | tail -200)
          fi
          FILTERED=$(echo "$FILTERED" | head -c 15000)

          PROMPT=$(cat <<EOF
Kamu adalah expert DevOps & Flutter developer. Analisis log error build Flutter berikut.

KONTEKS:
- Build type: $BUILD_TYPE
- Tag: $TAG
- Runner: Ubuntu 24.04 + Java 17

LOG ERROR:
\`\`\`
$FILTERED
\`\`\`

Berikan analisis SINGKAT, PADAT, dalam BAHASA INDONESIA dengan format:

🔴 **MASALAH UTAMA**: 
(1-2 kalimat: apa error utamanya)

📌 **PENYEBAB**:
(2-3 poin: root cause)

✅ **SOLUSI**:
(2-4 langkah konkret)

💡 **CEGAH TERULANG**:
(1-2 tips)

⚠️ **CATATAN**:
(opsional)

ATURAN: Maksimal 350 kata. Fokus solusi konkret.
EOF
          )
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s -X POST \
            "https://api.deepseek.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -d "{
              \"model\": \"deepseek-chat\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Kamu expert Flutter & DevOps yang bantu developer Indonesia perbaiki error build. Jawab singkat dalam Bahasa Indonesia.\"},
                {\"role\": \"user\", \"content\": $PROMPT_JSON}
              ],
              \"max_tokens\": 800,
              \"temperature\": 0.3
            }")

          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$API_ERROR" ]; then
            AI_ANSWER="⚠️ AI tidak bisa menganalisis (API error: $API_ERROR)"
          else
            AI_ANSWER=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI tidak memberi jawaban"')
          fi

          TOKENS_IN=$(echo "$RESPONSE" | jq -r '.usage.prompt_tokens // 0')
          TOKENS_OUT=$(echo "$RESPONSE" | jq -r '.usage.completion_tokens // 0')
          COST=$(echo "scale=6; ($TOKENS_IN * 0.14 + $TOKENS_OUT * 0.28) / 1000000" | bc)

          echo "═══════════════════════════════════════════"
          echo "🤖 ANALISIS AI (DeepSeek):"
          echo "═══════════════════════════════════════════"
          echo "$AI_ANSWER"
          echo "═══════════════════════════════════════════"

          {
            echo "$AI_ANSWER"
            echo ""
            echo "---"
            echo "Tokens: in=$TOKENS_IN out=$TOKENS_OUT"
            echo "Cost: \$$COST"
          } > ${{ github.workspace }}/ai-analysis.txt

          {
            echo "## ❌ Build Gagal"
            echo ""
            echo "**Tag:** \`$TAG\` | **Type:** \`$BUILD_TYPE\`"
            echo ""
            echo "### 🤖 Analisis AI (DeepSeek)"
            echo ""
            echo "$AI_ANSWER"
          } >> $GITHUB_STEP_SUMMARY

          echo "✅ AI analysis selesai"

      - name: 📤 Upload AI Analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/ai-analysis.txt
          if-no-files-found: warn
          retention-days: 3
