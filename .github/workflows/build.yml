name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP source'
        required: true
      tag:
        description: 'Tag release'
        required: true
      build_type:
        description: 'release atau debug'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Download ZIP
        id: download
        shell: bash
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          echo "URL: $URL"
          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "Attempt $i/$MAX_RETRY"
            HTTP_CODE=$(curl -L -s -w "%{http_code}" -o source.zip "$URL" || echo "000")
            echo "HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Download sukses"
              break
            else
              if [ "$i" -eq "$MAX_RETRY" ]; then
                echo "Download gagal"
                exit 1
              fi
              sleep 3
            fi
          done
          ls -lh source.zip
          SIZE=$(stat -c%s source.zip)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Size: $SIZE bytes"

      - name: Validate ZIP
        shell: bash
        run: |
          set -e
          SIZE="${{ steps.download.outputs.size }}"
          if [ "$SIZE" -lt 10000 ]; then
            echo "File terlalu kecil"
            exit 1
          fi
          MAGIC=$(head -c 4 source.zip | xxd -p)
          if [ "$MAGIC" != "504b0304" ]; then
            echo "Bukan ZIP valid (magic: $MAGIC)"
            exit 1
          fi
          echo "ZIP valid"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          mkdir -p source
          unzip -q source.zip -d source
          echo "=== Isi source ==="
          ls -la source/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Detect Flutter version
        id: detect
        shell: bash
        run: |
          set -e
          ROOT=$(find source -maxdepth 4 -name pubspec.yaml -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then
            echo "pubspec.yaml gak ketemu"
            find source -maxdepth 4 | head -50
            exit 1
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Project root: $ROOT"

          FLUTTER_VER=""
          SOURCE=""
          DART_FULL=""
          DART_MINOR=""

          if [ -f "$ROOT/.fvmrc" ]; then
            FVM_VER=$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' "$ROOT/.fvmrc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -n "$FVM_VER" ]; then FLUTTER_VER="$FVM_VER"; SOURCE=".fvmrc"; fi
          fi

          if [ -z "$FLUTTER_VER" ]; then
            FV=$(grep -E '^\s*flutter_version\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*:\s*"?([0-9.]+)"?.*/\1/' || true)
            if [ -n "$FV" ] && [ "$FV" != "null" ]; then FLUTTER_VER="$FV"; SOURCE="pubspec.yaml:flutter_version"; fi
          fi

          if [ -z "$FLUTTER_VER" ]; then
            FENV=$(grep -E '^\s*flutter\s*:' "$ROOT/pubspec.yaml" | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -n "$FENV" ]; then FLUTTER_VER="$FENV"; SOURCE="pubspec.yaml:environment.flutter"; fi
          fi

          if [ -z "$FLUTTER_VER" ]; then
            DART_CONSTRAINT=$(grep -E '^\s*sdk\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*sdk\s*:\s*//; s/["'"'"']//g' || true)
            echo "Dart constraint: $DART_CONSTRAINT"

            DART_LOWER=$(echo "$DART_CONSTRAINT" | grep -oE '>=[[:space:]]*[0-9]+\.[0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -z "$DART_LOWER" ]; then
              DART_LOWER=$(echo "$DART_CONSTRAINT" | grep -oE '\^[0-9]+\.[0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            fi
            if [ -z "$DART_LOWER" ]; then
              DART_LOWER=$(echo "$DART_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            fi

            DART_FULL="$DART_LOWER"
            DART_MINOR=$(echo "$DART_LOWER" | grep -oE '^[0-9]+\.[0-9]+' || true)

            echo "Dart full: $DART_FULL"
            echo "Dart minor: $DART_MINOR"

            # ═══════════════════════════════════════════════════════
            # MAPPING LENGKAP: Dart → Flutter (sampai versi 2026)
            # ═══════════════════════════════════════════════════════
            MAPPING="2.0:1.0.0 2.1:1.12.13 2.2:1.17.0 2.3:1.20.0 2.4:1.22.0 2.5:2.0.0 2.6:2.0.0 2.7:2.2.0 2.8:2.5.0 2.9:2.8.0 2.10:2.10.0 2.11:2.10.0 2.12:2.0.0 2.13:2.2.0 2.14:2.5.0 2.15:2.8.0 2.16:2.10.0 2.17:3.0.0 2.18:3.3.0 2.19:3.7.0 3.0:3.32.0 3.1:3.32.0 3.2:3.32.0 3.3:3.32.0 3.4:3.32.0 3.5:3.32.0 3.6:3.32.0 3.7:3.32.0 3.8:3.47.5 3.8.1:3.47.5 3.9:3.35.0 3.10:3.10.3 3.11:3.13.0 3.12:3.16.0 3.13:3.13.0 3.14:3.16.0 3.15:3.19.0 3.16:3.16.0 3.17:3.19.0 3.18:3.22.0 3.19:3.19.0 3.20:3.24.0 3.21:3.27.0 3.22:3.22.0 3.23:3.27.0 3.24:3.24.0 3.25:3.29.0 3.26:3.32.0 3.27:3.27.0 3.28:3.32.0 3.29:3.29.0 3.30:3.32.0 3.31:3.35.0 3.32:3.32.0 3.33:3.35.0 3.34:3.35.0 3.35:3.35.0 3.36:3.36.0 3.37:3.37.0 3.38:3.38.0 3.39:3.39.0 3.40:3.40.0 3.41:3.41.0 3.42:3.42.0 3.43:3.43.0 3.44:3.44.0 3.45:3.45.0 3.46:3.46.0 3.47:3.47.0 3.48:3.48.0 3.49:3.49.0 3.50:3.50.0"

            # STEP 1: Match FULL version dulu (3.8.1, 3.10.3, dll)
            for pair in $MAPPING; do
              DM="${pair%%:*}"; FV="${pair##*:}"
              if [ "$DM" = "$DART_FULL" ]; then FLUTTER_VER="$FV"; SOURCE="dart-full:$DART_FULL"; break; fi
            done

            # STEP 2: Kalau gak match, pakai minor
            if [ -z "$FLUTTER_VER" ]; then
              for pair in $MAPPING; do
                DM="${pair%%:*}"; FV="${pair##*:}"
                if [ "$DM" = "$DART_MINOR" ]; then FLUTTER_VER="$FV"; SOURCE="dart-minor:$DART_MINOR"; break; fi
              done
            fi

            # STEP 3: Kalau masih gak match, cari versi Flutter TERBARU
            if [ -z "$FLUTTER_VER" ]; then
              FLUTTER_VER="stable"; SOURCE="fallback-stable"
            fi
          fi

          if [ -z "$FLUTTER_VER" ]; then FLUTTER_VER="stable"; SOURCE="fallback"; fi

          echo "Flutter version: $FLUTTER_VER (dari: $SOURCE)"
          echo "flutter=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "dart_full=$DART_FULL" >> $GITHUB_OUTPUT
          echo "dart_minor=$DART_MINOR" >> $GITHUB_OUTPUT

      - name: Validate Flutter Version
        id: validate
        shell: bash
        run: |
          set -e
          VER="${{ steps.detect.outputs.flutter }}"
          echo "Validasi versi: $VER"
          if [ "$VER" = "stable" ]; then
            echo "flutter=stable" >> $GITHUB_OUTPUT
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${VER}-stable.tar.xz")
          if [ "$HTTP" != "200" ]; then
            echo "Flutter $VER tidak valid (HTTP $HTTP), fallback stable"
            echo "flutter=stable" >> $GITHUB_OUTPUT
          else
            echo "Flutter $VER valid"
            echo "flutter=$VER" >> $GITHUB_OUTPUT
          fi

      - name: Install Flutter (manual clone)
        shell: bash
        run: |
          set -e
          VER="${{ steps.validate.outputs.flutter }}"
          echo "Installing Flutter: $VER"
          if [ "$VER" = "stable" ]; then
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
          else
            git clone --depth 1 -b "$VER" https://github.com/flutter/flutter.git /opt/flutter
          fi
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Flutter doctor
        shell: bash
        run: |
          flutter --version
          flutter config --no-analytics || true
          flutter doctor -v || true

      - name: Auto-fix Android toolchain
        id: android_fix
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e
          FLUTTER_REAL=$(flutter --version | head -1 | awk '{print $2}')
          FLUTTER_MM=$(echo "$FLUTTER_REAL" | grep -oE '^[0-9]+\.[0-9]+' || echo "3.32")
          echo "Flutter: $FLUTTER_REAL ($FLUTTER_MM)"

          GUDANG="3.0:7.5:7.4.2:1.7.10:11 3.3:7.5:7.4.2:1.7.10:11 3.7:7.5:7.4.2:1.7.10:11 3.10:8.0:8.0.2:1.8.0:17 3.13:8.1.0:8.1.0:1.8.0:17 3.16:8.3:8.1.1:1.8.22:17 3.19:8.3:8.2.1:1.8.22:17 3.22:8.4:8.3.0:1.9.22:17 3.24:8.6:8.3.0:1.9.24:17 3.27:8.9:8.6.0:2.0.20:17 3.29:8.10:8.7.0:2.0.21:17 3.32:8.12:8.7.0:2.1.0:17 3.35:8.14:8.7.0:2.1.0:17 3.47:8.14:8.9.1:2.1.10:17 3.48:8.14:8.9.1:2.1.10:17 3.49:8.14:8.9.1:2.1.10:17 3.50:8.14:8.9.1:2.1.10:17"

          GRADLE="8.12"; AGP="8.7.0"; KOTLIN="2.1.0"; JDK="17"

          for pair in $GUDANG; do
            FMM=$(echo "$pair" | cut -d: -f1)
            GR=$(echo "$pair" | cut -d: -f2)
            AG=$(echo "$pair" | cut -d: -f3)
            KT=$(echo "$pair" | cut -d: -f4)
            JK=$(echo "$pair" | cut -d: -f5)
            if [ "$(printf '%s\n%s' "$FMM" "$FLUTTER_MM" | sort -V | tail -1)" = "$FLUTTER_MM" ]; then
              GRADLE="$GR"; AGP="$AG"; KOTLIN="$KT"; JDK="$JK"
            fi
          done

          echo "Toolchain: Gradle=$GRADLE AGP=$AGP Kotlin=$KOTLIN JDK=$JDK"
          echo "gradle=$GRADLE" >> $GITHUB_OUTPUT
          echo "agp=$AGP" >> $GITHUB_OUTPUT
          echo "kotlin=$KOTLIN" >> $GITHUB_OUTPUT
          echo "jdk=$JDK" >> $GITHUB_OUTPUT

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i "s|gradle-[0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?-\(all\|bin\).zip|gradle-${GRADLE}-bin.zip|g" "$WRAPPER"
          fi

          for SETTINGS in android/settings.gradle.kts android/settings.gradle; do
            if [ -f "$SETTINGS" ]; then
              sed -i -E "s|(id\(\"com\.android\.application\"\)\s+version\s+\")[^\"]+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'com\.android\.application'\s+version\s+')[^']+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\(\"org\.jetbrains\.kotlin\.android\"\)\s+version\s+\")[^\"]+|\1${KOTLIN}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'org\.jetbrains\.kotlin\.android'\s+version\s+')[^']+|\1${KOTLIN}|g" "$SETTINGS"
            fi
          done

          for BUILD in android/build.gradle.kts android/build.gradle; do
            if [ -f "$BUILD" ]; then
              sed -i -E "s|(com\.android\.tools\.build:gradle:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${AGP}|g" "$BUILD"
              sed -i -E "s|(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${KOTLIN}|g" "$BUILD"
            fi
          done

          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -q "android.useAndroidX" "$GRADLE_PROPS" || echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
            grep -q "android.enableJetifier" "$GRADLE_PROPS" || echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
            grep -q "org.gradle.jvmargs" "$GRADLE_PROPS" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> "$GRADLE_PROPS"
          fi

      - name: Setup Java (custom)
        if: steps.android_fix.outputs.jdk != '17'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ steps.android_fix.outputs.jdk }}

      - name: Flutter pub get
        id: pubget
        continue-on-error: true
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set +e
          flutter --version 2>&1 | tee "${{ github.workspace }}/build.log"
          flutter pub get 2>&1 | tee -a "${{ github.workspace }}/build.log"
          exit 0

      - name: Retry pub get
        if: steps.pubget.outcome == 'failure'
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set +e
          echo "pub get gagal, coba ulang"
          flutter pub get 2>&1 | tee -a "${{ github.workspace }}/build.log"
          exit 0

      - name: Flutter build APK
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="debug"; fi
          flutter build apk --$BUILD_TYPE --android-skip-build-dependency-validation 2>&1 | tee -a "${{ github.workspace }}/build.log" || \
          flutter build apk --$BUILD_TYPE 2>&1 | tee -a "${{ github.workspace }}/build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: |
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      # ═══════════════════════════════════════════════════════
      # AI ERROR ANALYZER — JAWABAN SINGKAT & FOKUS
      # ═══════════════════════════════════════════════════════
      - name: AI Error Analyzer
        if: failure()
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAG: ${{ github.event.inputs.tag }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLUTTER_VER: ${{ steps.detect.outputs.flutter }}
          DART_FULL: ${{ steps.detect.outputs.dart_full }}
          DART_MINOR: ${{ steps.detect.outputs.dart_minor }}
        run: |
          set -e
          echo "AI Error Analyzer dimulai..."
          LOG_FILE="${GITHUB_WORKSPACE}/build.log"
          if [ -f "$LOG_FILE" ]; then
            FILTERED=$(grep -n -iE "error|fail|exception|cannot|unable|missing|not found|invalid|conflict|required|version|sdk" "$LOG_FILE" | head -40 || true)
            if [ $(echo "$FILTERED" | wc -l) -lt 3 ]; then
              FILTERED=$(tail -100 "$LOG_FILE" || true)
            fi
          else
            FILTERED="Tidak ada build.log."
          fi
          FILTERED=$(echo "$FILTERED" | head -c 4000 || true)

          # Prompt ringkas & fokus
          P=$(printf 'Build Flutter gagal. Kasih jawaban SINGKAT & PADAT.\n\nVERSI:\n- Flutter terinstall: %s\n- Dart dibutuhkan: %s\n- Build type: %s\n\nERROR LOG:\n%s\n\nJAWAB DENGAN FORMAT INI (maks 200 kata):\n\nERROR: [1 kalimat]\nFIX: [langkah konkret]\nVERSI YANG BENAR: [Flutter X.Y.Z kalau masalah versi]' "$FLUTTER_VER" "$DART_FULL" "$BUILD_TYPE" "$FILTERED")

          jq -n --arg model "deepseek-chat" --arg sys "Jawab singkat, padat, fokus. Maks 200 kata." --arg user "$P" '{model:$model, messages:[{role:"system",content:$sys},{role:"user",content:$user}], max_tokens:600, temperature:0.3}' > /tmp/payload.json

          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" --data @/tmp/payload.json)

          AI_ANSWER=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$AI_ANSWER" ]; then
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null || true)
            if [ -n "$API_ERROR" ]; then
              AI_ANSWER="API Error: $API_ERROR"
            else
              AI_ANSWER="AI kosong. Cek API key / kuota DeepSeek."
            fi
          fi

          echo "==========================================="
          echo "ANALISIS AI (DeepSeek):"
          echo "==========================================="
          echo "$AI_ANSWER"
          echo "$AI_ANSWER" > "${GITHUB_WORKSPACE}/ai-analysis.txt"
          {
            echo "## Build Gagal"
            echo ""
            echo "- Flutter: $FLUTTER_VER"
            echo "- Dart: $DART_FULL"
            echo "- Build: $BUILD_TYPE"
            echo ""
            echo "### Analisis AI"
            echo ""
            echo "$AI_ANSWER"
          } >> $GITHUB_STEP_SUMMARY
          echo "AI analysis selesai"

      - name: Upload AI Analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/ai-analysis.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload build.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
          retention-days: 3
