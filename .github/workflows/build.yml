name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP source'
        required: true
      tag:
        description: 'Tag release'
        required: true
      build_type:
        description: 'release atau debug'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Download ZIP
        id: download
        shell: bash
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          echo "URL: $URL"
          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "Attempt $i/$MAX_RETRY"
            HTTP_CODE=$(curl -L -s -w "%{http_code}" -o source.zip "$URL" || echo "000")
            echo "HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Download sukses"
              break
            else
              if [ "$i" -eq "$MAX_RETRY" ]; then
                echo "Download gagal"; exit 1
              fi
              sleep 3
            fi
          done
          ls -lh source.zip
          SIZE=$(stat -c%s source.zip)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Size: $SIZE bytes"

      - name: Validate ZIP
        shell: bash
        run: |
          set -e
          SIZE="${{ steps.download.outputs.size }}"
          if [ "$SIZE" -lt 10000 ]; then echo "File kecil"; exit 1; fi
          MAGIC=$(head -c 4 source.zip | xxd -p)
          if [ "$MAGIC" != "504b0304" ]; then echo "Bukan ZIP"; exit 1; fi
          echo "ZIP valid"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          mkdir -p source
          unzip -q source.zip -d source
          ls -la source/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Detect Flutter version
        id: detect
        shell: bash
        run: |
          set -e
          ROOT=$(find source -maxdepth 4 -name pubspec.yaml -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then
            echo "pubspec.yaml gak ketemu"
            find source -maxdepth 4 | head -50
            exit 1
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Project root: $ROOT"

          if [ -f "$ROOT/.fvmrc" ]; then
            FVM_VER=$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' "$ROOT/.fvmrc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "$FVM_VER" ]; then
              echo "fvmrc Flutter: $FVM_VER"
              echo "flutter=$FVM_VER" >> $GITHUB_OUTPUT
              echo "source=manual" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          FV=$(grep -E '^\s*flutter_version\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*:\s*"?([0-9.]+)"?.*/\1/' || true)
          if [ -n "$FV" ] && [ "$FV" != "null" ]; then
            echo "pubspec flutter_version: $FV"
            echo "flutter=$FV" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          DART_CONSTRAINT=$(grep -E '^\s*sdk\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*sdk\s*:\s*//; s/["'"'"']//g' || true)
          echo "Dart constraint: $DART_CONSTRAINT"
          DART_MINOR=$(echo "$DART_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+' | tail -1 || true)
          echo "Dart minor: $DART_MINOR"

          if [ -z "$DART_MINOR" ] && [ -f "$ROOT/pubspec.lock" ]; then
            DART_MINOR=$(grep -A5 '^sdks:' "$ROOT/pubspec.lock" | grep -E '^\s*dart\s*:' | grep -oE '[0-9]+\.[0-9]+' | tail -1 || true)
            echo "pubspec.lock Dart: $DART_MINOR"
          fi

          MAPPING="
            2.0  1.0.0
            2.1  1.12.13
            2.2  1.17.0
            2.3  1.20.0
            2.4  1.22.0
            2.5  2.0.0
            2.6  2.0.0
            2.7  2.2.0
            2.8  2.5.0
            2.9  2.8.0
            2.10 2.10.0
            2.11 2.10.0
            2.12 2.0.0
            2.13 2.2.0
            2.14 2.5.0
            2.15 2.8.0
            2.16 2.10.0
            2.17 3.0.0
            2.18 3.3.0
            2.19 3.7.0
            3.0  3.10.0
            3.1  3.13.0
            3.2  3.16.0
            3.3  3.19.0
            3.4  3.22.0
            3.5  3.24.0
            3.6  3.27.0
            3.7  3.29.0
            3.8  3.32.0
            3.9  3.35.0
            3.10 3.35.0
            3.11 3.35.0
            3.12 3.35.0
            3.13 3.35.0
          "

          FLUTTER=""
          for line in $MAPPING; do
            DM=$(echo "$line" | awk '{print $1}')
            FV=$(echo "$line" | awk '{print $2}')
            if [ "$DM" = "$DART_MINOR" ]; then FLUTTER="$FV"; break; fi
          done

          if [ -z "$FLUTTER" ]; then
            echo "Dart minor tidak ada di mapping, fallback stable"
            FLUTTER="stable"
          fi

          echo "Flutter dipilih: $FLUTTER"
          echo "flutter=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Validate Flutter Version
        id: validate
        shell: bash
        run: |
          set -e
          VER="${{ steps.detect.outputs.flutter }}"
          echo "Cek versi: $VER"
          if [ "$VER" = "stable" ]; then
            echo "flutter=stable" >> $GITHUB_OUTPUT
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${VER}-stable.tar.xz")
          if [ "$HTTP" != "200" ]; then
            echo "Flutter $VER tidak valid, fallback stable"
            echo "flutter=stable" >> $GITHUB_OUTPUT
          else
            echo "Flutter $VER valid"
            echo "flutter=$VER" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.validate.outputs.flutter }}
          channel: 'stable'
          cache: true

      - name: Auto-fix Android toolchain versions
        id: android_fix
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -e
          FLUTTER_VER="${{ steps.validate.outputs.flutter }}"
          echo "Flutter version: $FLUTTER_VER"

          GUDANG="
            1.0  4.10.2  3.0.0   1.2.71   8
            1.12 4.10.2  3.5.0   1.3.50   8
            1.17 5.6.4   3.6.4   1.3.72   8
            1.20 6.1.1   4.0.1   1.3.72   8
            1.22 6.7     4.1.0   1.4.32   8
            2.0  6.7     4.1.0   1.4.32   8
            2.2  6.7     4.1.0   1.5.31   8
            2.5  6.7     4.1.0   1.5.31   8
            2.8  6.7     4.2.0   1.6.10   8
            2.10 6.7     4.2.0   1.6.10   8
            3.0  7.5     7.4.2   1.7.10   11
            3.3  7.5     7.4.2   1.7.10   11
            3.7  7.5     7.4.2   1.7.10   11
            3.10 8.0     8.0.2   1.8.0    17
            3.13 8.1.0   8.1.0   1.8.0    17
            3.16 8.3     8.1.1   1.8.22   17
            3.19 8.3     8.2.1   1.8.22   17
            3.22 8.4     8.3.0   1.9.22   17
            3.24 8.6     8.3.0   1.9.24   17
            3.27 8.9     8.6.0   2.0.20   17
            3.29 8.10    8.7.0   2.0.21   17
            3.32 8.12    8.7.0   2.1.0    17
            3.35 8.14    8.7.0   2.1.0    17
            3.47 8.14    8.9.1   2.1.10   17
          "

          if [ "$FLUTTER_VER" = "stable" ]; then
            FLUTTER_MM="3.35"
          else
            FLUTTER_MM=$(echo "$FLUTTER_VER" | grep -oE '^[0-9]+\.[0-9]+' || echo "3.32")
          fi

          GRADLE="8.12"
          AGP="8.7.0"
          KOTLIN="2.1.0"
          JDK="17"

          for line in $GUDANG; do
            FMM=$(echo "$line" | awk '{print $1}')
            GR=$(echo "$line" | awk '{print $2}')
            AG=$(echo "$line" | awk '{print $3}')
            KT=$(echo "$line" | awk '{print $4}')
            JK=$(echo "$line" | awk '{print $5}')
            if [ "$(printf '%s\n%s' "$FMM" "$FLUTTER_MM" | sort -V | tail -1)" = "$FLUTTER_MM" ]; then
              GRADLE="$GR"; AGP="$AG"; KOTLIN="$KT"; JDK="$JK"
            fi
          done

          echo "Toolchain: Gradle=$GRADLE, AGP=$AGP, Kotlin=$KOTLIN, JDK=$JDK"
          echo "gradle=$GRADLE" >> $GITHUB_OUTPUT

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i "s|gradle-[0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?-\(all\|bin\).zip|gradle-${GRADLE}-bin.zip|g" "$WRAPPER"
          fi

          for SETTINGS in android/settings.gradle.kts android/settings.gradle; do
            if [ -f "$SETTINGS" ]; then
              sed -i -E "s|(id\(\"com\.android\.application\"\)\s+version\s+\")[^\"]+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'com\.android\.application'\s+version\s+')[^']+|\1${AGP}|g" "$SETTINGS"
              sed -i -E "s|(id\(\"org\.jetbrains\.kotlin\.android\"\)\s+version\s+\")[^\"]+|\1${KOTLIN}|g" "$SETTINGS"
              sed -i -E "s|(id\s+'org\.jetbrains\.kotlin\.android'\s+version\s+')[^']+|\1${KOTLIN}|g" "$SETTINGS"
            fi
          done

          for BUILD in android/build.gradle.kts android/build.gradle; do
            if [ -f "$BUILD" ]; then
              sed -i -E "s|(com\.android\.tools\.build:gradle:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${AGP}|g" "$BUILD"
              sed -i -E "s|(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?|\1${KOTLIN}|g" "$BUILD"
            fi
          done

          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            grep -q "android.useAndroidX" "$GRADLE_PROPS" || echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
            grep -q "android.enableJetifier" "$GRADLE_PROPS" || echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
            grep -q "org.gradle.jvmargs" "$GRADLE_PROPS" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> "$GRADLE_PROPS"
          fi

          echo "Toolchain Android sudah di-fix"

      - name: Setup Java (custom)
        if: steps.android_fix.outputs.jdk != '17'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ steps.android_fix.outputs.jdk }}

      - name: Flutter pub get
        id: pubget
        continue-on-error: true
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set +e
          flutter --version 2>&1 | tee "${{ github.workspace }}/build.log"
          flutter pub get 2>&1 | tee -a "${{ github.workspace }}/build.log"
          exit 0

      - name: Retry pub get
        if: steps.pubget.outcome == 'failure'
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set +e
          echo "pub get gagal, coba ulang"
          flutter pub get 2>&1 | tee -a "${{ github.workspace }}/build.log"
          exit 0

      - name: Flutter build APK
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="debug"; fi
          flutter build apk --$BUILD_TYPE --android-skip-build-dependency-validation 2>&1 | tee -a "${{ github.workspace }}/build.log" || \
          flutter build apk --$BUILD_TYPE 2>&1 | tee -a "${{ github.workspace }}/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: |
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: AI Error Analyzer (Groq)
        if: failure()
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAG: ${{ github.event.inputs.tag }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLUTTER_VER: ${{ steps.detect.outputs.flutter }}
        run: |
          set -e
          echo "AI Error Analyzer (Groq) dimulai"
          LOG_FILE="${GITHUB_WORKSPACE}/build.log"
          if [ -f "$LOG_FILE" ]; then
            FILTERED=$(grep -n -iE "error|fail|exception|cannot|unable|missing|not found|invalid|conflict|required|version|sdk|dart|undefined|unresolved|no such|does not|compilation|compil|assert|typeerror|null" "$LOG_FILE" | head -150 || true)
            if [ $(echo "$FILTERED" | wc -l) -lt 10 ]; then
              FILTERED=$(tail -300 "$LOG_FILE" || true)
            fi
          else
            FILTERED="build.log tidak dihasilkan. Build gagal sebelum step pub get selesai. Flutter version: ${FLUTTER_VER}. Build type: ${BUILD_TYPE}."
          fi
          FILTERED=$(echo "$FILTERED" | head -c 25000 || true)

          {
            echo "Kamu expert Flutter developer. Analisis error build berikut."
            echo ""
            echo "KONTEKS:"
            echo "Flutter: ${FLUTTER_VER}"
            echo "Build type: ${BUILD_TYPE}"
            echo ""
            echo "ERROR LOG:"
            echo "${FILTERED}"
            echo ""
            echo "ATURAN JAWABAN WAJIB DIIKUTI:"
            echo "Pakai BAHASA INDONESIA"
            echo "Tulis PLAIN TEXT saja, JANGAN pakai markdown"
            echo "DILARANG pakai simbol bintang pagar pipa garis bawah tanda lebih besar tanda kurung siku backtick"
            echo "DILARANG bikin tabel"
            echo "DILARANG bikin header dengan garis"
            echo "Cukup pakai huruf biasa angka titik koma tanda tanya tanda seru dan tanda hubung biasa"
            echo ""
            echo "FORMAT JAWABAN plain text saja:"
            echo ""
            echo "ERROR: jelaskan error utama dalam 1-2 kalimat"
            echo ""
            echo "LOKASI: nama file dan baris kalau ada. Kalau tidak ada tulis N A"
            echo ""
            echo "PENYEBAB: jelaskan kenapa terjadi 2-4 baris"
            echo ""
            echo "FIX: langkah perbaikan konkret tulis bernomor sebutkan nama file yang harus diubah"
            echo ""
            echo "CONTOH KODE: kalau perlu kasih contoh perbaikan"
            echo ""
            echo "VERSI: Flutter versi berapa yang cocok atau tulis N A"
          } > /tmp/prompt.txt

          jq -n \
            --arg model "openai/gpt-oss-120b" \
            --arg sys "Kamu expert Flutter developer. Jawab detail dalam Bahasa Indonesia. DILARANG pakai markdown. Tulis plain text saja." \
            --rawfile user /tmp/prompt.txt \
            '{model:$model, messages:[{role:"system",content:$sys},{role:"user",content:$user}], max_tokens:2000, temperature:0.3}' > /tmp/payload.json

          echo "Kirim ke Groq"
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            --data @/tmp/payload.json)

          AI_ANSWER=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$AI_ANSWER" ]; then
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null || true)
            if [ -n "$API_ERROR" ]; then
              AI_ANSWER="API Error: $API_ERROR"
            else
              AI_ANSWER="AI kosong. Cek GROQ_API_KEY atau kuota Groq."
            fi
          fi

          echo "==========================================="
          echo "ANALISIS AI (Groq):"
          echo "==========================================="
          echo "$AI_ANSWER"
          echo "$AI_ANSWER" > "${GITHUB_WORKSPACE}/ai-analysis.txt"
          echo "$FILTERED" > "${GITHUB_WORKSPACE}/error-raw.txt"

          {
            echo "## Build Gagal"
            echo ""
            echo "Flutter: $FLUTTER_VER"
            echo "Build: $BUILD_TYPE"
            echo ""
            echo "### Analisis AI (Groq)"
            echo ""
            echo "$AI_ANSWER"
          } >> $GITHUB_STEP_SUMMARY

          echo "AI analysis selesai"

      - name: Upload AI Analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-${{ github.event.inputs.tag }}
          path: |
            ${{ github.workspace }}/ai-analysis.txt
            ${{ github.workspace }}/error-raw.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Auto-Fix pubspec.yaml (kalau error versi)
        id: pubspec_fix
        if: failure()
        shell: bash
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e
          LOG_FILE="${GITHUB_WORKSPACE}/build.log"
          PUBSPEC="${{ steps.detect.outputs.root }}/pubspec.yaml"
          FIXED_DIR="${GITHUB_WORKSPACE}/pubspec-fixed"
          mkdir -p "$FIXED_DIR"

          if [ ! -f "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ada, skip"
            exit 0
          fi

          IS_VERSION_ERROR=false
          if [ -f "$LOG_FILE" ]; then
            if grep -q -iE "dart sdk version|sdk version.*requires|version solving failed|incompatible.*sdk|requires sdk|flutter.*version.*incompatible" "$LOG_FILE"; then
              IS_VERSION_ERROR=true
            fi
          fi

          if [ "$IS_VERSION_ERROR" = false ]; then
            echo "Bukan error versi, skip auto-fix pubspec"
            exit 0
          fi

          echo "Error versi terdeteksi, AI akan generate pubspec baru"

          PUBSPEC_CONTENT=$(cat "$PUBSPEC")
          FLUTTER_VER="${{ steps.detect.outputs.flutter }}"

          {
            echo "Kamu expert Flutter developer. Tugas kamu: PERBAIKI pubspec.yaml berikut agar kompatibel dengan error versi yang terjadi."
            echo ""
            echo "VERSI FLUTTER YANG DIPAKAI: ${FLUTTER_VER}"
            echo ""
            echo "ISI pubspec.yaml SAAT INI:"
            echo "$PUBSPEC_CONTENT"
            echo ""
            echo "ATURAN WAJIB:"
            echo "Kembalikan HANYA isi pubspec.yaml yang sudah diperbaiki"
            echo "JANGAN ada penjelasan, JANGAN ada markdown, JANGAN ada kode blok"
            echo "Mulai langsung dari baris pertama (biasanya name:)"
            echo "Perbaiki constraint sdk agar sesuai versi Flutter"
            echo "Perbaiki constraint flutter_version kalau ada"
            echo "JANGAN ubah nama package"
            echo "JANGAN ubah dependencies yang tidak perlu"
            echo "JANGAN hapus dependency yang sudah ada"
            echo "JANGAN hapus section apapun (flutter:, dev_dependencies:, dll)"
            echo "Hanya naikkan atau turunkan versi dependency yang KONFLIK saja"
            echo "Kalau ragu, biarkan saja"
          } > /tmp/pubspec-prompt.txt

          jq -n \
            --arg model "openai/gpt-oss-120b" \
            --arg sys "Kamu expert Flutter. Output kamu HARUS isi pubspec.yaml yang valid, tanpa penjelasan apapun. Mulai dari baris pertama name:" \
            --rawfile user /tmp/pubspec-prompt.txt \
            '{model:$model, messages:[{role:"system",content:$sys},{role:"user",content:$user}], max_tokens:2000, temperature:0.2}' > /tmp/pubspec-payload.json

          echo "Minta AI generate pubspec.yaml baru..."
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            --data @/tmp/pubspec-payload.json)

          NEW_PUBSPEC=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$NEW_PUBSPEC" ]; then
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null || true)
            echo "Gagal generate pubspec: $API_ERROR"
            exit 0
          fi

          NEW_PUBSPEC=$(echo "$NEW_PUBSPEC" | sed -E 's/^```ya?ml$//; s/^```$//' | sed '/^```/d')

          VALID=true
          if ! echo "$NEW_PUBSPEC" | grep -q "^name:"; then
            echo "VALIDASI GAGAL: name hilang"
            VALID=false
          fi
          if ! echo "$NEW_PUBSPEC" | grep -q "^dependencies:"; then
            echo "VALIDASI GAGAL: dependencies hilang"
            VALID=false
          fi
          OLD_LINES=$(echo "$PUBSPEC_CONTENT" | wc -l)
          NEW_LINES=$(echo "$NEW_PUBSPEC" | wc -l)
          echo "Baris pubspec asli: $OLD_LINES, baru: $NEW_LINES"
          if [ "$NEW_LINES" -lt $((OLD_LINES / 2)) ]; then
            echo "VALIDASI GAGAL: pubspec baru terlalu pendek"
            VALID=false
          fi

          if [ "$VALID" = false ]; then
            echo "Pubspec baru tidak valid, tidak dikirim ke user"
            exit 0
          fi

          echo "Pubspec baru lolos validasi"

          echo "$NEW_PUBSPEC" > "$FIXED_DIR/pubspec.yaml"
          echo "$PUBSPEC_CONTENT" > "$FIXED_DIR/pubspec-original.yaml"

          {
            echo "File pubspec.yaml sudah diperbaiki otomatis oleh AI."
            echo ""
            echo "CARA PAKAI:"
            echo "1. Download file pubspec-fixed.zip"
            echo "2. Extract"
            echo "3. Ganti file pubspec.yaml di project kamu dengan yang baru"
            echo "4. Jalankan: flutter pub get"
            echo "5. Build ulang dari bot"
            echo ""
            echo "File di dalam zip:"
            echo "- pubspec.yaml         : versi baru (hasil AI)"
            echo "- pubspec-original.yaml: versi asli (backup)"
            echo ""
            echo "VERSI FLUTTER: ${FLUTTER_VER}"
          } > "$FIXED_DIR/ARAHAN.txt"

          cd "${GITHUB_WORKSPACE}"
          zip -r pubspec-fixed.zip pubspec-fixed/ > /dev/null
          echo "pubspec-fixed.zip siap"

      - name: Upload pubspec-fixed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-fixed-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/pubspec-fixed.zip
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload build.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
          retention-days: 3
