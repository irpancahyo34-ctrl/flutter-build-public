name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP source'
        required: true
      tag:
        description: 'Tag release'
        required: true
      build_type:
        description: 'release atau debug'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Download ZIP
        id: download
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          echo "🔗 URL: $URL"

          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "📥 Attempt $i/$MAX_RETRY"
            HTTP_CODE=$(curl -L -s -w "%{http_code}" -o source.zip "$URL" || echo "000")
            echo "📥 HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Download sukses"
              break
            else
              echo "⚠️ Attempt $i gagal"
              if [ "$i" -eq "$MAX_RETRY" ]; then
                echo "❌ Download gagal"
                cat source.zip || true
                exit 1
              fi
              sleep 3
            fi
          done

          ls -lh source.zip
          SIZE=$(stat -c%s source.zip)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Validate ZIP
        run: |
          set -e
          SIZE="${{ steps.download.outputs.size }}"
          echo "📦 Size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ File terlalu kecil"
            cat source.zip
            exit 1
          fi
          MAGIC=$(head -c 4 source.zip | xxd -p)
          if [ "$MAGIC" != "504b0304" ]; then
            echo "❌ Bukan ZIP valid (magic: $MAGIC)"
            cat source.zip
            exit 1
          fi
          echo "✅ ZIP valid"

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p source
          unzip -q source.zip -d source
          echo "=== Isi source ==="
          ls -la source/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ─────────────────────────────────────────────
      # 🔍 STEP BARU: Deteksi versi Flutter dari project
      # ─────────────────────────────────────────────
      - name: Detect Flutter version
        id: detect
        run: |
          set -e

          # Cari pubspec.yaml dulu
          ROOT=$(find source -maxdepth 4 -name pubspec.yaml -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ pubspec.yaml gak ketemu"
            find source -maxdepth 4 | head -50
            exit 1
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✅ Project root: $ROOT"

          # ── Prioritas 1: cek .fvmrc ──
          if [ -f "$ROOT/.fvmrc" ]; then
            FVM_VER=$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' "$ROOT/.fvmrc" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "$FVM_VER" ]; then
              echo "🎯 Versi dari .fvmrc: $FVM_VER"
              echo "flutter=$FVM_VER" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # ── Prioritas 2: cek field flutter_version di pubspec ──
          FV=$(grep -E '^\s*flutter_version\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*:\s*"?([0-9.]+)"?.*/\1/' || true)
          if [ -n "$FV" ] && [ "$FV" != "null" ]; then
            echo "🎯 Versi dari pubspec flutter_version: $FV"
            echo "flutter=$FV" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Prioritas 3: mapping Dart SDK → Flutter ──
          DART_CONSTRAINT=$(grep -E '^\s*sdk\s*:' "$ROOT/pubspec.yaml" | head -1 | sed -E 's/.*sdk\s*:\s*//; s/["'"'"']//g' || true)
          echo "📋 Dart constraint: $DART_CONSTRAINT"

          # Ambil angka minor Dart (contoh ">=3.8.1 <4.0.0" → 3.8)
          DART_MINOR=$(echo "$DART_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)
          echo "📋 Dart minor: $DART_MINOR"

          case "$DART_MINOR" in
            3.0|3.1|3.2|3.3|3.4) FLUTTER="3.19.0" ;;
            3.5)                 FLUTTER="3.24.0" ;;
            3.6)                 FLUTTER="3.27.0" ;;
            3.7)                 FLUTTER="3.29.0" ;;
            3.8)                 FLUTTER="3.35.0" ;;
            3.9|3.10|3.11)       FLUTTER="3.47.5" ;;
            *)
              echo "⚠️ Tidak ketemu mapping, pakai stable terbaru"
              FLUTTER="stable"
              ;;
          esac

          echo "🎯 Akan pakai Flutter: $FLUTTER"
          echo "flutter=$FLUTTER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter }}
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: ${{ steps.detect.outputs.root }}
        run: flutter pub get

      - name: Flutter build APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: flutter build apk --${{ github.event.inputs.build_type }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: |
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.detect.outputs.root }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
